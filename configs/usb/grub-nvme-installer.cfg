# System ESP while the NVMe installer slice is still present.
# If you see "Omarchy Linux" / "Advanced options", this file did not run.
echo '========================================'
echo '  OMARCHY NVMe installer GRUB'
echo '========================================'
set timeout=8
set default=0

search --no-floppy --file /initramfs-omarchy-usb.img --set=root

menuentry 'Omarchy Mac live (NVMe installer)' {
  echo 'GRUB is running from the System ESP (NVMe installer)'
  linux /vmlinuz-linux-asahi quiet loglevel=0 appledrm.show_notch=1 systemd.show_status=0 rd.systemd.show_status=0 systemd.mask=plymouth-start.service systemd.mask=plymouth-quit-wait.service systemd.mask=ldconfig.service
  initrd /initramfs-omarchy-usb.img
}

if [ -f /grub/custom.cfg ]; then
  source /grub/custom.cfg
fi
